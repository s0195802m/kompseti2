#include <iostream>
#include <fstream>
#include <windows.h>
#include <string>
#include <sys/stat.h>
using namespace std;

// Функция для получения размера файла 
long get_file_size(const string& filename) {
    struct _stat info;
    if (_stat(filename.c_str(), &info) == 0)
        return info.st_size;
    return 0;
}

int main() {
    setlocale(LC_ALL, "rus");

    string fileRequest = "C:/Users/Дмитрий/source/repos/f1.txt";
    string fileAnswer = "C:/Users/Дмитрий/source/repos/f2.txt";

    cout << "Клиент запущен..." << endl;

    while (true) {
        string name;
        int height, weight;

        cout << "\nВведите имя: ";
        cin >> name;
        cout << "Введите рост (см): ";
        cin >> height;
        cout << "Введите вес (кг): ";
        cin >> weight;

        // Запись запроса в текстовый файл
        ofstream out(fileRequest, ios::app);
        out << name << " " << height << " " << weight << endl;
        out.close();

        cout << "Запрос отправлен серверу. Ожидание ответа..." << endl;






        //   пока сервер добавит ответ 
        long prevSize = get_file_size(fileAnswer);
        while (true) {
            Sleep(500);
            long currSize = get_file_size(fileAnswer);
            if (currSize > prevSize) {
                ifstream in(fileAnswer);  //...
                in.seekg(prevSize); // читаем только новую строку
                string line;
                getline(in, line);
                in.close();

                cout << "Ответ сервера: " << line << endl;
                break;
            }
        }
    }

    return 0;
}
