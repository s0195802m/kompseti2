#include <iostream>
#include <fstream>
#include <windows.h>
#include <string>
#include <sstream>
using namespace std;

struct Student {
    string name;
    int height;
    int weight;
};

int main() {
    setlocale(LC_ALL, "rus");

    
    string fileRequest = "C:/Users/Дмитрий/source/repos/f1.txt";
    string fileAnswer = "C:/Users/Дмитрий/source/repos/f2.txt";

    cout << "Сервер запущен..." << endl;

    streampos prevPos = 0;

    while (true) {
        ifstream in(fileRequest, ios::ate);
        if (!in) {
            Sleep(500);
            continue;
        }

        streampos currPos = in.tellg();

        // появился новый запрос,если файл увелич
        if (currPos > prevPos) {
            in.seekg(prevPos);
            string line;
            getline(in, line);
            prevPos = currPos;
            in.close();

            // имя рост вес строка
            Student s;
            istringstream iss(line);
            iss >> s.name >> s.height >> s.weight;

            // Обрабатываем инфу
            double ideal = (s.height - 100) * 0.9;
            string result;
            if (s.weight > ideal + 5)
                result = "Избыточный вес";
            else if (s.weight < ideal - 5)
                result = "Недостаток веса";
            else
                result = "Норма";

            cout << "Обработан запрос от " << s.name << " -> " << result << endl;

            //  ответ
            ofstream out(fileAnswer, ios::app);
            out << s.name << ": " << result << endl;
            out.close();          
        }

        Sleep(500);
    }

    return 0;
}
